name: Migration Status

on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout t81-roadmap
        uses: actions/checkout@v4
        with:
          path: t81-roadmap

      - name: Checkout t81-vm
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-vm
          path: t81-vm
          ref: main

      - name: Checkout t81-lang
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-lang
          path: t81-lang
          ref: main

      - name: Checkout t81-python
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-python
          path: t81-python
          ref: main

      - name: Checkout t81-docs
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-docs
          path: t81-docs
          ref: main

      - name: Checkout t81-examples
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-examples
          path: t81-examples
          ref: main

      - name: Checkout ternary-tools
        uses: actions/checkout@v4
        with:
          repository: t81dev/ternary-tools
          path: ternary-tools
          ref: main

      - name: Checkout ternary-pager
        uses: actions/checkout@v4
        with:
          repository: t81dev/ternary-pager
          path: ternary-pager
          ref: main

      - name: Checkout t81-benchmarks
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-benchmarks
          path: t81-benchmarks
          ref: main

      - name: Generate release manifest
        working-directory: t81-roadmap
        run: python3 scripts/generate_ecosystem_release_manifest.py

      - name: Sync migration blocker issues
        working-directory: t81-roadmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_migration_blockers.py

      - name: Generate migration status board
        working-directory: t81-roadmap
        run: python3 scripts/generate_migration_status.py

      - name: Commit and push migration status updates
        working-directory: t81-roadmap
        run: |
          if git diff --quiet -- ECOSYSTEM_RELEASE_MANIFEST.json MIGRATION_BLOCKERS.json MIGRATION_STATUS.md; then
            echo "No migration status changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECOSYSTEM_RELEASE_MANIFEST.json MIGRATION_BLOCKERS.json MIGRATION_STATUS.md
          git commit -m "chore: refresh migration status board"
          git push origin HEAD:main

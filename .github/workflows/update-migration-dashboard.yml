name: Update Migration Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * 1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout t81-roadmap
        uses: actions/checkout@v4
        with:
          path: t81-roadmap

      - name: Checkout t81-vm
        uses: actions/checkout@v4
        with:
          repository: t81dev/t81-vm
          path: t81-vm
          ref: main

      - name: Generate migration dashboard
        run: scripts/generate_migration_dashboard.sh MIGRATION_DASHBOARD.md
        working-directory: t81-roadmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: t81dev
          T81_VM_DIR: ${{ github.workspace }}/t81-vm

      - name: Commit and push dashboard updates
        working-directory: t81-roadmap
        run: |
          if git diff --quiet -- MIGRATION_DASHBOARD.md; then
            echo "No dashboard changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIGRATION_DASHBOARD.md
          git commit -m "chore: refresh migration dashboard"
          git push origin HEAD:main
